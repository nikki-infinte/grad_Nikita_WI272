spring.application.name=multipleDB

# ================= PRIMARY (H2) =================
spring.datasource.jdbc-url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# ================= SECONDARY (PostgreSQL) =================
spring.second-datasource.jdbc-url=jdbc:postgresql://localhost:5432/studentdb
spring.second-datasource.username=postgres
spring.second-datasource.password=postgres
spring.second-datasource.driver-class-name=org.postgresql.Driver

# ================= JPA =================
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect


spring.h2.console.enabled=true
spring.h2.console.path=/h2-console