version: '3'

services:

  db:
    image: postgres
    container_name: postgres-db

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: testdb

    ports:
      - "5432:5432"

  app:
    build: .
    container_name: java-app

    depends_on:
      - db
      