<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Bank Website</title>
   
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

   <body class="bg-light">

    <!-- Header -->
    <header class="bg-success text-white text-center py-3 shadow">
        <h3 class="mb-0">Wissen Bank</h3>
    </header>

    <div class="container-fluid">
        <div class="row" style="min-height: 85vh;">

            <!-- Sidebar -->
            <nav class="col-md-3 col-lg-2 bg-white border-end pt-4 shadow-sm">
                <ul class="nav flex-column nav-pills" id="menuList">
                    <li class="nav-item">
                        <button class="nav-link active" onclick="loadPage('home', this)">Home</button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link" onclick="loadPage('services', this)">Services</button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link" onclick="loadPage('about', this)">About Us</button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link" onclick="loadPage('netbanking', this)">Net Banking</button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link" onclick="loadPage('contact', this)">Contact</button>
                    </li>
                </ul>
            </nav>

            <!-- Main Content -->
            <main class="col-md-9 col-lg-10 p-4" id="content">
                <div class="card shadow-sm p-4">
                    <h4>Welcome to Wissen Bank</h4>
                    <p>Select a menu to load content.</p>
                </div>
            </main>

        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-success text-white text-center py-2">
        <small>© 2026 Wissen Bank. All rights reserved.</small>
    </footer>

    

    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
